seed: 42
work_dir: ./work_dir_facd_v6b_div2k
expr: 'DIV2K_v6b_FACD_GAN'
wandb_project: 
wandb_entity: ''
wandb_key: ''
use_tensorboard: True

dataset:
  img_size: 256
  batch_size: 4
  train_path: [./dataset/DIV2K_train_HR]
  val_path: ./dataset/DIV2K_valid_HR
  num_workers: 8
  resize_size: 0
  random_crop: True
  center_crop: False
  val_img_size: 512
  random_crop_val: False
  center_crop_val: True
  use_aug: True
  num_classes: 

ir:
  degradation: sr_interp
  mode: bicubic
  scale_factor: 4
  sigma_y: 0.0
  calc_LPIPS: True
  calc_FID: False
  sigma_pertubation: 0.2

fm_model:
  flow_t_schedule: uniform
  use_cond: True
  T: 1.
  eps: !!float 0.001

network:
  zero_init: True
  model_path: ''
  model_arch: guided_unet
  in_channels: 3
  out_channels: 3
  num_channels: 128
  num_res_blocks: 1
  attention_resolutions: "16"
  num_heads: 4
  dropout: 0.1
  channel_mult: "1, 1, 2, 2, 4, 4"
  resblock_updown: True
  use_group_norm: True
  use_attention: True
  use_input_skip: False
  ema_rate: 0.9999
  skip_mode: concat
  depth_per_layer: 4
  patch_size: 1
  window_size: 8

train:





  resume_from: ''
  pre_train_model: 'path/to/stage1_checkpoint.pth'
  accumulation_steps: 1
  progress: False
  max_steps: 30000
  loss_type: lpips
  weight_schedule: uniform
  record_iters: 100
  validate_iters: 1000
  snapshot_freq_for_preemption: 5000
  snapshot_freq: 2500
  use_amp: True
  amp_dtype: fp32
  compile: False
  reduce_mean: True

optim:
  optimizer: Adam
  beta1: 0.9
  beta2: 0.999
  eps: !!float 1e-8
  weight_decay: !!float 0.0
  grad_clip: 1.
  lr: !!float 2e-6
  warmup: 0
  lr_decay: 0

sample:
  pre_train_model: ''
  use_ode_sampler: rk45
  sample_N: 8
  ode_tol: !!float 1e-3
  num_sample: 16
  eta: 0.0
  num_psnr_sample: 100
  psnr_batch_size: 1
  noise_var: 0.0
  rho: 1.
  rk2_r: 1.
  file_ext: png
  use_one_step: True
  one_step_t: 0.99

boot:
  t_min: !!float 0.01
  t_max: 0.99
  t_step: 0.05
  teacher_solver: rk2
  rk2_r: 0.5
  distil_loss: v_boot
  lambda_distil: 1.
  lambda_boundary: 0.1
  lambda_align: 0.01
  lambda_lpips: 1.0
  lambda_img_freq: 0.0
  lambda_hf_img: 0.0


facd:
  enabled: False
  weight_mode: cosine
  alpha: 0.0
  log_every: 200


gan:
  enabled: True
  lambda_gan: 0.05
  warmup_steps: 1000
  r1_gamma: 0.5
  r1_every: 16
  disc_lr: !!float 1e-4

tcma:
  enabled: False
